<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f172a;
    --surface:#1e293b;
    --surface-2:#334155;
    --text:#f1f5f9;
    --text-muted:#94a3b8;
    --accent:#38bdf8;
    --accent-dim:rgba(56,189,248,.12);
    --danger:#f87171;
    --danger-dim:rgba(248,113,113,.12);
    --success:#4ade80;
    --success-dim:rgba(74,222,128,.12);
    --radius:12px;
    --shadow:0 4px 24px rgba(0,0,0,.35);
    --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  html{font-family:var(--font);color-scheme:dark}
  body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:2rem 1rem;
  }
  .app{width:100%;max-width:480px}

  /* Header */
  header{margin-bottom:1.5rem}
  header h1{
    font-size:1.75rem;font-weight:700;letter-spacing:-.02em;
    display:flex;align-items:center;gap:.5rem;
  }
  header h1 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);display:inline-block;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  header p{color:var(--text-muted);font-size:.875rem;margin-top:.25rem}

  /* Input */
  .input-row{display:flex;gap:.5rem;margin-bottom:1.25rem}
  .input-row input{
    flex:1;padding:.75rem 1rem;
    background:var(--surface);border:1px solid var(--surface-2);
    border-radius:var(--radius);color:var(--text);font-size:.938rem;
    outline:none;transition:border-color .2s;
  }
  .input-row input::placeholder{color:var(--text-muted)}
  .input-row input:focus{border-color:var(--accent)}
  .input-row button{
    padding:.75rem 1.1rem;
    background:var(--accent);color:#0f172a;
    border:none;border-radius:var(--radius);
    font-weight:600;font-size:.938rem;cursor:pointer;
    transition:transform .15s,opacity .15s;
  }
  .input-row button:hover{opacity:.9}
  .input-row button:active{transform:scale(.96)}

  /* Stats */
  .stats{
    display:flex;gap:.5rem;margin-bottom:1rem;
    font-size:.8rem;color:var(--text-muted);
  }
  .stats span{
    background:var(--surface);padding:.3rem .6rem;
    border-radius:6px;
  }
  .stats .done{color:var(--success)}
  .stats .remain{color:var(--accent)}

  /* List */
  ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
  li{
    display:flex;align-items:center;gap:.75rem;
    background:var(--surface);
    border:1px solid var(--surface-2);
    border-radius:var(--radius);
    padding:.85rem 1rem;
    animation:slideIn .25s ease;
    transition:opacity .2s,border-color .2s;
  }
  li:hover{border-color:var(--accent)}
  li.completed{opacity:.55}
  li.completed .label{text-decoration:line-through;color:var(--text-muted)}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Checkbox */
  .check{
    width:22px;height:22px;flex-shrink:0;
    border:2px solid var(--surface-2);border-radius:6px;
    cursor:pointer;display:grid;place-items:center;
    transition:background .2s,border-color .2s;
  }
  .check:hover{border-color:var(--accent)}
  li.completed .check{background:var(--success);border-color:var(--success)}
  li.completed .check svg{display:block}
  .check svg{display:none;width:14px;height:14px;fill:none;stroke:#0f172a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  /* Label */
  .label{flex:1;font-size:.938rem;line-height:1.4;word-break:break-word}

  /* Delete */
  .del{
    width:32px;height:32px;flex-shrink:0;
    display:grid;place-items:center;
    background:transparent;border:none;border-radius:8px;
    color:var(--text-muted);cursor:pointer;
    transition:background .15s,color .15s;
  }
  .del:hover{background:var(--danger-dim);color:var(--danger)}
  .del svg{width:16px;height:16px}

  /* Empty state */
  .empty{
    text-align:center;padding:3rem 1rem;
    color:var(--text-muted);font-size:.938rem;
  }
  .empty .icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.5}

  /* Footer */
  footer{margin-top:1.5rem;text-align:center;font-size:.75rem;color:var(--text-muted);opacity:.6}
  footer kbd{
    background:var(--surface-2);padding:.15rem .4rem;
    border-radius:4px;font-family:var(--font);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>Todo</h1>
    <p>今日待辦事項</p>
  </header>

  <div class="input-row">
    <input id="input" type="text" placeholder="加入新事項…" autocomplete="off" maxlength="200">
    <button id="add">加入</button>
  </div>

  <div class="stats" id="stats"></div>

  <ul id="list"></ul>

  <footer>按 <kbd>Enter</kbd> 加入 &middot; 點擊圓圈完成 / 未完成 &middot; 數據存於瀏覽器本地</footer>
</div>

<script>
const KEY = 'todo_items';
const $input = document.getElementById('input');
const $add   = document.getElementById('add');
const $list  = document.getElementById('list');
const $stats = document.getElementById('stats');

/* ---- state ---- */
let todos = JSON.parse(localStorage.getItem(KEY) || '[]');

function save() {
  localStorage.setItem(KEY, JSON.stringify(todos));
}

/* ---- render ---- */
function render() {
  $list.innerHTML = '';
  if (!todos.length) {
    $list.innerHTML = `<div class="empty"><div class="icon">📋</div>尚無待辦<br>輸入上方加入第一項</div>`;
  } else {
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'completed' : '';
      li.innerHTML = `
        <div class="check" data-i="${i}" role="checkbox" aria-checked="${t.done}" tabindex="0">
          <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>
        </div>
        <span class="label"></span>
        <button class="del" data-i="${i}" aria-label="刪除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>`;
      li.querySelector('.label').textContent = t.text;
      $list.appendChild(li);
    });
  }
  const done = todos.filter(t => t.done).length;
  $stats.innerHTML = todos.length
    ? `<span class="remain">${todos.length - done} 待完成</span><span class="done">${done} 已完成</span>`
    : '';
}

/* ---- actions ---- */
function addTodo() {
  const text = $input.value.trim();
  if (!text) return;
  todos.unshift({ id: Date.now(), text, done: false });
  $input.value = '';
  save(); render();
}

$add.addEventListener('click', addTodo);
$input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

$list.addEventListener('click', e => {
  const check = e.target.closest('.check');
  const del   = e.target.closest('.del');
  if (check) {
    const i = +check.dataset.i;
    todos[i].done = !todos[i].done;
    save(); render();
  }
  if (del) {
    const i = +del.dataset.i;
    todos.splice(i, 1);
    save(); render();
  }
});

/* keyboard toggle on check */
$list.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const check = e.target.closest('.check');
    if (check) { e.preventDefault(); check.click(); }
  }
});

render();
</script>
</body>
</html>
